on:
  push:
    branches:
      - main
  # Manual run: publishes the current version on main to npm. Use this to
  # retry when a release was created but the publish step failed.
  workflow_dispatch:
name: release-please
permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write
jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          release-type: node
      # The logic below handles the npm publication:
      - uses: actions/checkout@v7
        # these if statements ensure that a publication only occurs when
        # a new release is created:
        if: ${{ steps.release.outputs.release_created || github.event_name == 'workflow_dispatch' }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"
        if: ${{ steps.release.outputs.release_created || github.event_name == 'workflow_dispatch' }}
      - run: npm ci
        if: ${{ steps.release.outputs.release_created || github.event_name == 'workflow_dispatch' }}
      - run: npm run dev:prepare
        if: ${{ steps.release.outputs.release_created || github.event_name == 'workflow_dispatch' }}
      - run: npm run build
        if: ${{ steps.release.outputs.release_created || github.event_name == 'workflow_dispatch' }}
      - run: npm publish
        if: ${{ steps.release.outputs.release_created || github.event_name == 'workflow_dispatch' }}
