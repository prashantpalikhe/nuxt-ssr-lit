name: PR Check
on:
  pull_request:
    branches:
      - main

jobs:
  build:
    name: Build packages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Install Nuxt Playground dependencies
        run: cd playground && npm ci

      - name: Prepare
        run: npm run dev:prepare

      - name: Build packages
        run: npm run build

      - name: Test Nuxt 3
        run: npm test
